<aside class="sidebar">
    <div class="logo">
        <i class="pi pi-shield"></i>
        <span>Users Management</span>
    </div>
    <nav>
        <a routerLink="/dashboard" routerLinkActive="active">
            <i class="pi pi-home"></i>
            <span>Dashboard</span>
        </a>
        <a *appHasPermission="permissions.USER_VIEW" routerLink="/users" routerLinkActive="active">
            <i class="pi pi-users"></i>
            <span>Users</span>
        </a>

        <a *appHasPermission="permissions.ROLE_VIEW" routerLink="/roles" routerLinkActive="active">
            <i class="pi pi-id-card"></i>
            <span>Roles</span>
        </a>
        <a *appHasPermission="permissions.PERMISSION_VIEW" routerLink="/permissions" routerLinkActive="active">
            <i class="pi pi-key"></i>
            <span>Permissions</span>
        </a>
        <a *appHasPermission="permissions.AUDIT_VIEW" routerLink="/audits" routerLinkActive="active">
            <i class="pi pi-history"></i>
            <span>Audits</span>
        </a>
    </nav>
