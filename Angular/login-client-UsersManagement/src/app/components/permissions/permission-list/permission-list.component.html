<div class="permission-page">
    <div class="page-header">
        <div>
            <h2>Permissions</h2>
        </div>
    </div>

    <p-card>
        <div class="toolbar">
            <p-iconfield class="permission-search">
                <p-inputicon styleClass="pi pi-search">
                </p-inputicon>
                <input
                    pInputText
                    type="text"
                    placeholder="Search permissions..."
                    [(ngModel)]="keyword"
                    (ngModelChange)="onSearchChange($event)" />
                <button
                    *ngIf="keyword"
                    pButton
                    type="button"
                    icon="pi pi-times"
                    text
                    rounded
                    class="clear-btn"
                    (click)="clearFilter()">
                </button>
            </p-iconfield>
        </div>
        <p-table
            [value]="permissions"
            [loading]="loading"
            [lazy]="true"
            [paginator]="true"
            [rows]="pageSize"
            [totalRecords]="totalRecords"
            [rowsPerPageOptions]="[10,20,50]"
            (onLazyLoad)="onLazyLoad($event)"
            responsiveLayout="scroll">
            <ng-template pTemplate="header">
                <tr>
                    <th>Feature Group</th>
                    <th>Feature Code</th>
                    <th>Action</th>
                    <th>Description</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-item>
                <tr>
                    <td>
                        <p-tag [value]="item.featureGroup">
                        </p-tag>
                    </td>
                    <td>
                        <span class="permission-code">
                            {{ item.featureCode }}
                        </span>
                    </td>
                    <td>
                        {{ item.action }}
                    </td>
                    <td>
                        {{ item.description }}
                    </td>
                </tr>
            </ng-template>
            <ng-template pTemplate="emptymessage">
                <tr>
                    <td colspan="4" class="empty-message">
                        No permissions found
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </p-card>
</div>
