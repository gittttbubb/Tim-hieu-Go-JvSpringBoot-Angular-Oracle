<div class="permission-page">
    <div class="page-header">
        <div>
            <h2>Permissions</h2>
        </div>
    </div>

    <p-card>
        <div class="toolbar">
            <div class="search-box">
                <i class="pi pi-search"></i>
                <input pInputText [(ngModel)]="searchKeyword" (input)="applyFilter()"
                    placeholder="Search permission..." />
            </div>
            <p-select class="group-filter" [options]="featureGroups" [(ngModel)]="selectedFeatureGroup"
                optionLabel="label" optionValue="value" placeholder="Feature Group" (onChange)="applyFilter()">
            </p-select>
            <button pButton type="button" icon="pi pi-filter-slash"  severity="secondary" label="Clear"
                (click)="clearFilter()">
            </button>

        </div>

        <p-table [value]="filteredPermissions" [loading]="loading" [paginator]="true" [rows]="20"
            [rowsPerPageOptions]="[10,20,50]" responsiveLayout="scroll" styleClass="p-datatable-sm">
            <ng-template pTemplate="header">
                <tr>
                    <th>Feature Group</th>
                    <th>Feature Code</th>
                    <th>Action</th>
                    <th>Description</th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-item>
                <tr>
                    <td><p-tag [value]="item.featureGroup"></p-tag></td>
                    <td><span class="permission-code"> {{ item.featureCode }}</span></td>
                    <td>{{ item.action }}</td>
                    <td>{{ item.description }}</td>
                </tr>
            </ng-template>

            <ng-template pTemplate="emptymessage">
                <tr>
                    <td colspan="4" class="empty-message">
                        No permissions found
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </p-card>
</div>
