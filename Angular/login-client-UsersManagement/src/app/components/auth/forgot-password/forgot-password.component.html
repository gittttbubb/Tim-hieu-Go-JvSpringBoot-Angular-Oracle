<div class="login-page">
    <div class="login-wrapper">
        <p-card class="login-card">
            <div class="login-header">
                <h1>Quên mật khẩu</h1>
                <p>Nhập email để nhận link đặt lại mật khẩu</p>
            </div>

            <form [formGroup]="form" (ngSubmit)="submit()">
                <div class="field">
                    <label>Email</label>
                    <input pInputText type="email" formControlName="email" placeholder="Enter your email" />
                </div>
                <button pButton type="submit" label="Gửi link đặt lại mật khẩu" [loading]="loading"></button>
            </form>
            <div class="link-page">
                <a routerLink="/login">Đăng nhập</a>
            </div>
        </p-card>
    </div>
</div>
