<div class="login-page">
    <div class="login-wrapper">
        <p-card class="login-card">
            <div class="login-header">
                <h1>{{ 'auth.forgotPassword.title' | translate }}</h1>
                <p>{{ 'auth.forgotPassword.subtitle' | translate }}</p>
            </div>

            <form [formGroup]="form" (ngSubmit)="submit()">
                <div class="field">
                    <label>{{ 'auth.forgotPassword.email' | translate }}</label>
                    <input pInputText type="email" formControlName="email" [placeholder]="'auth.forgotPassword.emailPlaceholder' | translate" />
                </div>
                <button pButton type="submit" [label]="'auth.forgotPassword.submit' | translate" [loading]="loading"></button>
            </form>
            <div class="link-page">
                <a routerLink="/login">{{ 'auth.forgotPassword.backToLogin' | translate }}</a>
            </div>
        </p-card>
    </div>
</div>
