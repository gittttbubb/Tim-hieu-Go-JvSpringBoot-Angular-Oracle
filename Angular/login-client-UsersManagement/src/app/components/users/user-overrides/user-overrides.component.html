<div class="override-page">
    <div class="page-header">
        <div>
            <h2>User Permission Overrides</h2>
            <p>
                {{ user?.fullName }}
                -
                {{ roleName }}
            </p>
        </div>
        <button pButton icon="pi pi-plus" label="Add Override" (click)="openDialog()">
        </button>
    </div>

    <p-table [value]="overrides" [loading]="loading">
        <ng-template pTemplate="header">
            <tr>
                <th>Permission</th>
                <th>Type</th>
                <th>Scope</th>
                <th>Reason</th>
                <th width="120">Action</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-item>
            <tr>
                <td>
                    {{ getPermissionName(item.permissionId) }}
                </td>
                <td>
                    <p-tag [value]="item.granted ? 'Grant' : 'Deny'" [severity]="item.granted ? 'success' : 'danger'">
                    </p-tag>
                </td>
                <td>
                    {{ item.dataScope }}
                </td>
                <td>
                    {{ item.reason }}
                </td>
                <td>
                    <button pButton icon="pi pi-trash" severity="danger" text (click)="deleteOverride(item.id)">
                    </button>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>

<p-dialog [(visible)]="dialogVisible" header="Assign Override" [modal]="true" [style]="{ width: '600px' }">
    <form [formGroup]="form" class="override-form">
        <div class="field">
            <label>
                Permission
            </label>
            <p-dropdown formControlName="permissionId" [options]="permissions" optionLabel="description"
                optionValue="id">
            </p-dropdown>
        </div>
        <div class="field">
            <label>
                Data Scope
            </label>
            <p-dropdown formControlName="dataScope" [options]="[
                    'OWN',
                    'TEAM',
                    'ALL'
                ]">
            </p-dropdown>
        </div>
        <div class="field">
            <label>
                Reason
            </label>
            <textarea pInputTextarea rows="3" formControlName="reason">
            </textarea>

        </div>
        <div class="field">
            <label>
                Grant Permission
            </label>
            <input type="checkbox" formControlName="granted">
        </div>
    </form>
    <ng-template pTemplate="footer">
        <button pButton label="Save" (click)="saveOverride()">
        </button>
    </ng-template>

</p-dialog>
