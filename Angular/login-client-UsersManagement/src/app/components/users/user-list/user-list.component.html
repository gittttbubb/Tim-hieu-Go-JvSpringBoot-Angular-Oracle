<div class="user-page">
    <div class="page-header">
        <div>
            <h2>Users Management</h2>
        </div>
        <button pButton icon="pi pi-plus" label="Thêm User" [routerLink]="['/users/create']">
        </button>
    </div>
    <div class="table-container">
        <p-table [value]="users" [loading]="loading" styleClass="p-datatable-sm">
            <ng-template pTemplate="header">
                <tr>
                    <th>Full Name</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Password</th>
                    <th width="180">Action</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-user>
                <tr>
                    <td>{{ user.fullName }}</td>
                    <td>{{ user.username }}</td>
                    <td>{{ user.email }}</td>
                    <td>{{ user.phone }}</td>
                    <td>{{ getRoleName(user.roleId) }}</td>
                    <td>
                        <p-tag [value]="user.status" [severity]="getStatusSeverity(user.status)"></p-tag>
                    </td>
                    <td>
                        <p-tag *ngIf="user.mustChangePassword" value="Must Change" severity="warn"></p-tag>
                        <span *ngIf="!user.mustChangePassword">—</span>
                    </td>
                    <td>
                        <div class="actions">
                            <button pButton icon="pi pi-eye" severity="info" text [routerLink]="['/users', user.id]"></button>
                            <button pButton icon="pi pi-pencil" severity="warn" text [routerLink]="['/users/edit', user.id]"></button>
                            <button pButton icon="pi pi-trash" severity="danger" text (click)="deleteUser(user.id)"></button>
                        </div>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>
