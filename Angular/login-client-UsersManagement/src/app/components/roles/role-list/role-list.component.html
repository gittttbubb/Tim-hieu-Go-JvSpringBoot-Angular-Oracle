<p-toast />
<p-confirmDialog />
<div class="flex justify-content-between mb-3">
    <h2>Roles</h2>
    <p-button
        label="Create Role"
        icon="pi pi-plus"
        (onClick)="createRole()">
    </p-button>

</div>

<p-table
    [value]="roles"
    [loading]="loading"
    responsiveLayout="scroll">
    <ng-template pTemplate="header">
        <tr>
            <th>Name</th>
            <th>Display Name</th>
            <th>Description</th>
            <th style="width: 300px">
                Actions
            </th>
        </tr>
    </ng-template>

    <ng-template
        pTemplate="body"
        let-role>
        <tr>
            <td>{{ role.name }}</td>
            <td>{{ role.displayName }}</td>
            <td>{{ role.description }}</td>
            <td>
                <div class="flex gap-2">
                    <p-button
                        icon="pi pi-eye"
                        severity="info"
                        [text]="true"
                        (onClick)="viewRole(role)">
                    </p-button>
                    <p-button
                        icon="pi pi-pencil"
                        severity="warn"
                        [text]="true"
                        (onClick)="editRole(role)">
                    </p-button>
                    <p-button
                        icon="pi pi-shield"
                        severity="help"
                        [text]="true"
                        (onClick)="managePermissions(role)">
                    </p-button>
                    <p-button
                        icon="pi pi-trash"
                        severity="danger"
                        [text]="true"
                        (onClick)="deleteRole(role)">
                    </p-button>
                </div>
            </td>
        </tr>
    </ng-template>
</p-table>
