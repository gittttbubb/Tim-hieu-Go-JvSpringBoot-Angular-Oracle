<p-toast />
<p-confirmDialog />
<div class="page-header">

    <h2>{{ 'roles.title' | translate }}</h2>

    <div class="header-actions">

        <p-iconfield class="search-box">

            <p-inputicon styleClass="pi pi-search">
            </p-inputicon>

            <input pInputText type="text" [placeholder]="'roles.searchPlaceholder' | translate" [(ngModel)]="keyword"
                (ngModelChange)="onSearchChange($event)" />

            <button *ngIf="keyword" pButton type="button" icon="pi pi-times" text rounded class="clear-btn"
                (click)="clearSearch()">
            </button>

        </p-iconfield>

        <p-button [label]="'roles.createRole' | translate" icon="pi pi-plus" (onClick)="createRole()">
        </p-button>

    </div>

</div>

<p-table [value]="roles" [loading]="loading" [lazy]="true" [paginator]="true" [rows]="pageSize"
    [totalRecords]="totalRecords" (onLazyLoad)="onLazyLoad($event)" responsiveLayout="scroll">
    <ng-template pTemplate="header">
        <tr>
            <th>{{ 'roles.fields.name' | translate }}</th>
            <th>{{ 'roles.fields.displayName' | translate }}</th>
            <th>{{ 'roles.fields.description' | translate }}</th>
            <th style="width: 300px">
                {{ 'common.actions' | translate }}
            </th>
        </tr>
    </ng-template>

    <ng-template pTemplate="body" let-role>
        <tr>
            <td>{{ role.name }}</td>
            <td>{{ role.displayName }}</td>
            <td>{{ role.description }}</td>
            <td>
                <div class="flex gap-2">
                    <p-button icon="pi pi-eye" severity="info" [text]="true" (onClick)="viewRole(role)">
                    </p-button>
                    <p-button icon="pi pi-pencil" severity="warn" [text]="true" (onClick)="editRole(role)">
                    </p-button>
                    <p-button icon="pi pi-shield" severity="help" [text]="true" (onClick)="managePermissions(role)">
                    </p-button>
                    <p-button icon="pi pi-trash" severity="danger" [text]="true" (onClick)="deleteRole(role)">
                    </p-button>
                </div>
            </td>
        </tr>
    </ng-template>
</p-table>
